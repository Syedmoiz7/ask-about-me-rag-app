<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask My Docs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .answer { white-space: pre-wrap; background: #f5f5f5; padding: 14px; border-radius: 6px; }
    .error { color: #b00020; }
    .mode { font-size: 13px; color: #666; }
    details { margin-top: 14px; font-size: 14px; }
    summary { cursor: pointer; color: #444; }
    summary .names { color: #666; }
    .source { border-left: 3px solid #ccc; padding: 6px 12px; margin: 10px 0; }
    .source b { display: block; margin-bottom: 2px; }
    .scores { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Ask My Docs</h1>
  <p class="sub">Ask about Moiz's projects, experience and tech stack. Answers come only from the documents.</p>

  <form id="form">
    <input id="question" placeholder="e.g. What was the Kelsey Scholarship Portal built with?" required maxlength="500">
    <button id="btn">Ask</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const btn = document.getElementById("btn");

    // Small helper to create elements. Using textContent (not innerHTML) means
    // text from the documents or the LLM can never run as HTML/JavaScript.
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      btn.disabled = true;
      result.replaceChildren(el("p", "mode", "Thinking..."));

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: document.getElementById("question").value }),
        });
        const data = await res.json();
        result.replaceChildren();

        if (!res.ok) {
          result.append(el("p", "error", data.error));
          return;
        }

        const modes = {
          "rag": "Answer generated by the LLM from the documents",
          "retrieval-only": "No API key set: showing retrieved chunks only",
          "no-match": "No relevant chunks found",
          "no-answer": "Related chunks were found, but they don't contain the answer",
        };
        // Show where the time went, e.g. "search 12 ms · LLM 1.8 s"
        const t = data.timings || {};
        const timing = [`search ${t.retrieval_ms} ms`];
        if (t.llm_ms !== undefined) timing.push(`LLM ${(t.llm_ms / 1000).toFixed(1)} s`);
        result.append(el("p", "mode", `${modes[data.mode]} · ${timing.join(" · ")}`));
        if (data.answer) result.append(el("div", "answer", data.answer));

        // A collapsible list: the summary line shows short names, clicking it
        // reveals the full chunk text and scores.
        function showChunks(label, note, chunks, open) {
          if (!chunks || !chunks.length) return;
          const names = chunks
            .map(s => (s.ref ? `[${s.ref}] ` : "") + `${s.source} › ${s.heading.split(" > ").pop()}`)
            .join(" · ");
          const details = el("details");
          details.open = open;
          const summary = el("summary", null, `${label}: `);
          summary.append(el("span", "names", names));
          details.append(summary);
          if (note) details.append(el("p", "mode", note));
          for (const s of chunks) {
            const box = el("div", "source");
            box.append(el("b", null, (s.ref ? `[${s.ref}] ` : "") + `${s.source} · ${s.heading}`));
            box.append(el("span", "scores",
              `score ${s.score} = meaning ${s.vector_score} + 0.3 × keywords ${s.keyword_score}`));
            box.append(el("span", null, s.text));
            details.append(box);
          }
          result.append(details);
        }

        // With an answer, sources start collapsed; without one, the chunks are the result.
        showChunks("Sources", null, data.sources, data.mode === "retrieval-only");

        const closestNotes = {
          "no-match": "These scored below the relevance cutoff, so they were not sent to the LLM.",
          "no-answer": "The LLM read these, but none of them answer the question.",
        };
        showChunks("Closest matches (not used)", closestNotes[data.mode], data.closest, false);
      } catch (err) {
        result.replaceChildren(el("p", "error", "Request failed: " + err));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
